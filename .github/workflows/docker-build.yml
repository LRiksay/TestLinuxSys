# Имя пайплайна (отображается во вкладке Actions)
name: Build and Push to Docker Hub

# Триггеры: когда запускать этот пайплайн
on:
  push:
    branches: [ "main" ] # Запускать только при пуше в ветку main

# Задачи (Jobs), которые будут выполняться
jobs:
  # Имя нашей задачи
  build-and-push:
    # На какой операционной системе запускать (GitHub предоставит чистую Ubuntu)
    runs-on: ubuntu-latest 
    
    # Шаги (Steps), которые выполняются последовательно внутри задачи
    steps:
      # Шаг 1: Скачиваем наш код из репозитория GitHub в виртуалку
      - name: Checkout code
        uses: actions/checkout@v4

      # Шаг 2: Аутентификация в Docker Hub с помощью секретов
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }} # Берем логин из секретов GitHub
          password: ${{ secrets.DOCKER_PASSWORD }} # Берем пароль/токен из секретов GitHub

      # Шаг 3: Сборка и отправка Docker-образа
      - name: Build and push Docker image
        run: |
          # Собираем образ из Dockerfile в текущей папке (точка в конце) и даем ему имя
          docker build -t lriksay/basics:latest .
          
          # Отправляем готовый образ в наш репозиторий на Docker Hub
          docker push lriksay/basics:latest
