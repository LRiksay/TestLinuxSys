name: Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ] # Срабатывает при пуше в ветку main (если у тебя master, поменяй)

jobs:
  build-and-push:
    runs-on: ubuntu-latest # Робот на чистой Ubuntu
    
    steps:
      # 1. Скачиваем наш код из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

    # 2. Логинимся в Docker Hub с помощью наших секретов
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
 
   # 3. Собираем образ и пушим его
      - name: Build and push Docker image
        run: |
          # ВАЖНО: замени 'my-flask-app' на имя репозитория, которое ты создал в Docker Hub!
          docker build -t ${{ secrets.DOCKER_USERNAME }}/lriksay/basics:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/lriksay/basics:latest
